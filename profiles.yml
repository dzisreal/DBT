dbt_sample:
  target: dev
  outputs:
    dev:
      type: postgres
      host: localhost
      port: 5432
      user: postgres
      pass: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: postgres
      schema: dev
      threads: 4
    prod:
      type: postgres
      host: localhost
      port: 5432
      user: postgres
      pass: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: postgres
      schema: prod
      threads: 4
